<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Customer</title></head><body style="font:16px Arial;max-width:600px;margin:40px auto"><h1>Customer</h1><form th:object="${customer}" th:action="${customer.id == null} ? @{/customers} : @{/customers/{id}(id=${customer.id})}" method="post"><p>Name<br><input th:field="*{name}" required maxlength="100"></p><p>Email<br><input th:field="*{email}" type="email" required maxlength="180"></p><p><button type="submit">Save</button> <a href="/customers">Cancel</a></p></form></body></html>
