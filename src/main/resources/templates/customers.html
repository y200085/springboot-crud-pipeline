<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Customers</title><style>body{font:16px Arial;max-width:900px;margin:40px auto}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #ddd}a,button{margin-right:8px}</style></head><body><h1>Customer directory</h1><p>Environment: <b th:text="${@environment.getProperty('spring.application.name')}">crud-app</b></p><p><a href="/customers/new">Add customer</a></p><table><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Actions</th></tr></thead><tbody><tr th:each="c : ${customers}"><td th:text="${c.id}"></td><td th:text="${c.name}"></td><td th:text="${c.email}"></td><td><a th:href="@{/customers/{id}/edit(id=${c.id})}">Edit</a><form th:action="@{/customers/{id}/delete(id=${c.id})}" method="post" style="display:inline"><button type="submit">Delete</button></form></td></tr></tbody></table></body></html>
